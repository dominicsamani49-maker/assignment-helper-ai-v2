<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Helper AI</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; padding: 20px; background: #f4f4f9; }
        #chat-window { flex: 1; overflow-y: auto; border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: white; margin-bottom: 10px; }
        .message { margin: 10px 0; padding: 10px; border-radius: 8px; max-width: 80%; }
        .user { background: #dcf8c6; align-self: flex-end; margin-left: auto; }
        .ai { background: #e9ecef; }
        #input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; }
    </style>
</head>
<body>

    <div id="chat-window"></div>
    <div id="input-area">
        <input type="file" id="fileInput">
        <input type="text" id="questionInput" placeholder="Ask a question...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const question = document.getElementById('questionInput').value;
            const file = document.getElementById('fileInput').files[0];
            const chatWindow = document.getElementById('chat-window');

            if (!question) return;

            // Add User Message
            chatWindow.innerHTML += `<div class="message user">${question}</div>`;
            document.getElementById('questionInput').value = '';

            // Add Typing Indicator
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai';
            aiMsg.innerText = "Typing...";
            chatWindow.appendChild(aiMsg);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            const formData = new FormData();
            formData.append('question', question);
            if (file) formData.append('file', file);

            const res = await fetch('/chat', { method: 'POST', body: formData });
            const data = await res.json();

            // Replace "Typing..." with actual answer
            aiMsg.innerText = data.answer;
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Press Enter to send
        document.getElementById('questionInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
